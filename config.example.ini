[general]
# Bluetooth-Adapter. Mit USB-Dongle ggf. hci1 (siehe: bluetoothctl list)
adapter = hci0

# Abstand zwischen zwei Messungen in Sekunden (HA-Integration: 600)
poll_interval = 600
# Neuer Versuch nach einem Fehler
retry_interval = 120

# Passiv mitlesen, wann der Sensor advertised (HCI-Monitor, rein lesend).
# Verbunden wird dann genau in diesem Moment -> kurzer Eingriff ins Funkmodul.
use_monitor = true
advert_wait = 300
# Verbindungsfenster direkt nach einem gesehenen Advertisement (Sekunden)
hinted_connect_window = 45
# Verbindungsfenster, wenn kein Advertisement gesehen wurde
# (z. B. weil gerade niemand scannt). 0 = dann gar nicht verbinden.
connect_window = 60

# Darf der Dienst selbst kurz eine Discovery starten, wenn bluetoothd den
# Sensor noch nicht kennt? Normalerweise nur beim ersten Mal noetig.
allow_discovery = true
discovery_timeout = 240
# Nach erfolgloser Discovery so lange keine neue starten
discovery_backoff = 3600

# Dichte von fluessigem Fluessiggas in kg/l (Propan ca. 0.51, Butan ca. 0.58).
# Nur fuer die Volumenanzeige; die exakten kg stehen unter /Truma/GasKg.
lpg_density = 0.51

# So lange ohne erfolgreiche Messung -> Tank-Status "getrennt"
stale_after = 3600

log_level = info

[sensor1]
# MAC finden: python3 dbus_truma_levelcontrol.py --find
mac =
name = Gasflasche links
bottle_kg = 11

